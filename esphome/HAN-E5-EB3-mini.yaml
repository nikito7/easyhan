# EB3 mini
# Bugs: possible overflows

interval:
  - interval: 15s
    then:
      - lambda: |-
          if (id(edpbox_polling).state) {
              id(esp_clock).update();
              id(edpbox).update();
          }

esphome:
  name: han-eb3
  friendly_name: HAN
  on_boot:
    priority: -500
    then:
      - switch.turn_on: led_pin
      - delay: 5s
      - switch.turn_on: edpbox_polling
  project:
    name: easyhan.edpbox3-e5
    version: "2.05"

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/HAN-E5-EB3-mini.yaml@dev
  import_full_config: true

esp8266:
  board: esp07s



wifi:
  output_power: 15db
  use_address: 10.1.0.53
  #use_address: "fd6a:7ff7:c70:1:70fc:f12c:7c8d:6f80"

  #ssid: ssn-7
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #password: edpbox123

  ap:
    ssid: "Easy-HAN-EB99"
    password: edpbox123

captive_portal:

### ### ###


### ### ###

web_server:
  local: true
  version: 3
  


api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

button:
  - platform: restart
    name: "ESP Restart"

###

switch:

  - platform: gpio
    id: led_pin
    pin:
      number: 2
      inverted: yes # C6 no
                   # esp07s yes

  - platform: template
    name: "ESP Polling"
    id: "edpbox_polling"
    optimistic: yes

###

uart:

#ifdef ESP32S3
#define HAN_DIR 16
#define HAN_TX 15
#define HAN_RX 17

#elif ESP32C6
#define HAN_DIR 3
#define HAN_TX 5
#define HAN_RX 4

  id: modbus_serial
  rx_pin:
    number: 3
    mode:
      input: true
      pullup: true
  tx_pin: 1
  baud_rate: 9600
  stop_bits: 1
  #stop_bits: 2 # ziv

modbus:
  flow_control_pin: 16
  id: modbus1
  uart_id: modbus_serial
  turnaround_time: 1000ms
  send_wait_time: 1500ms

modbus_controller:
  - id: edpbox
    update_interval: never
    address: 0x1
    setup_priority: -10
    command_throttle: 1000ms
    offline_skip_updates: 8
    max_cmd_retries: 0

###

sensor:

###

  - platform: template
    name: "ESP Free Heap"
    lambda: |-
      // arduino
      float heap = ESP.getFreeHeap();
      // idf
      //float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    name: "ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""
    entity_category: diagnostic

