### Load Profile ###


#######
### ### ###

globals:

   - id: idx3
     type: int
     restore_value: no
     initial_value: '0' 

   - id: idx4
     type: int
     restore_value: no
     initial_value: '0'

   - id: idx6
     type: int
     restore_value: no
     initial_value: '0'

### ### ###

text_sensor:

### ### ###

#  - platform: openthread_info
#    role:
#      name: "Thread Device Role"

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
    entity_category: diagnostic

  - platform: template
    name: "ESP Clock"
    icon: mdi:clock
    lambda: |-
      char str[25];
      time_t currTime = id(esptime).now().timestamp;
      strftime(str, sizeof(str), "%H:%M:%S", localtime(&currTime));
      return {str};
    update_interval: never
    id: esp_clock

###

  - platform: modbus_controller
    name: "Clock"
    register_type: read
    address: 0x0001
    register_count: 1
    response_size: 12
    raw_encode: HEXBYTES
    icon: mdi:clock
    lambda: |-
        uint8_t hh, mm, ss;
        hh = data[5];
        mm = data[6];
        ss = data[7];
        char ebclk[20];
        sprintf(ebclk,"%02d:%02d:%02d",hh,mm,ss);
        return {ebclk};
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

###

  - platform: modbus_controller
    force_new_range: true        ### ###
    name: "Tariff"
    register_type: read
    address: 0x000B
    register_count: 1
    response_size: 2
    raw_encode: COMMA
    icon: mdi:counter
    lambda: |-
        auto z = "Null";
        if (x == "1,0") z = "Vazio";
        else if (x == "2,0") z = "Ponta";
        else if (x == "3,0") z = "Cheias";
        return {z};
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin
