# Pulse Counter
# Binary Counter (TI HC4040)

substitutions:
  dev: Pulse
  name: pulse

globals:
   - id: cubic
     type: float
     restore_value: yes
     initial_value: '0.001' 

#deep_sleep:
#  id: sleep1
#  run_duration: 40s
#  sleep_duration: 5min
#  wakeup_pin: 7
#  wakeup_pin_mode: KEEP_AWAKE

esphome:
  name: ${name}
  project:
    name: easyhan.pulse-hc
    version: "1.23"
  on_boot:
    priority: 1000
    then:
      - lambda: |-
          pinMode(5, INPUT_PULLDOWN);
          pinMode(6, INPUT_PULLDOWN);
          pinMode(7, INPUT_PULLDOWN);
          pinMode(8, INPUT_PULLDOWN);
          pinMode(9, INPUT_PULLDOWN);
          pinMode(10, INPUT_PULLDOWN);
          pinMode(11, INPUT_PULLDOWN);
          pinMode(12, INPUT_PULLDOWN);
          pinMode(13, INPUT_PULLDOWN);
          pinMode(14, INPUT_PULLDOWN);
          pinMode(15, INPUT_PULLDOWN);
          pinMode(16, INPUT_PULLDOWN);
          //
          pinMode(17, OUTPUT);
          digitalWrite(17, LOW);
          //
          pinMode(39, OUTPUT);
          digitalWrite(39, LOW);


dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/Pulse.yaml@dev
  import_full_config: true

esp32:
  board: esp32-s3-devkitc-1 # N8
  framework:
    type: arduino
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  #use_address: 10.1.0.39

