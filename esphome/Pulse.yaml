# Pulse Counter
# Binary Counter

substitutions:
  dev: Pulse
  name: pulse

esphome:
  name: ${name}
  project:
    name: easyhan.pulse
    version: "1.01"

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/Pulse.yaml@dev
  import_full_config: true

esp32:
  board: esp32-s3-devkitc-1 # N8
  framework:
    type: arduino
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  #use_address: 10.1.0.39

  ssid: !secret wifi_ssid
  #password: !secret wifi_password
  password: edpbox123

  ap:
    ssid: "Easy-HAN-${dev}"
    password: edpbox123
    ap_timeout: 20s # change me

captive_portal:

###

###

esp32_ble_tracker:
bluetooth_proxy:

###

web_server:
  local: true
  version: 3
  
logger:
  #level: debug
  level: verbose

api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

## ## ##

output:
  - platform: gpio
    pin: 17
    id: qq_clear

## ## ##

button:
  - platform: restart
    name: "${dev} ESP Restart"

  - platform: output
    name: "${dev} Counter Clear Debug"
    output: qq_clear
    id: qq_clear_bt
    duration: 100ms

