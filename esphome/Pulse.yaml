## ## ##
sensor:

###



  - platform: template
    name: "${dev} Adc In"
    id: adc_in_v
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement

  - platform: adc
    name: "${dev} Adc In raw" # ESP32-S3 PCB
    raw: true
    pin: 1
    attenuation: 0dB
    samples: 8
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    icon: mdi:information
    state_class: measurement
    on_value:
      then:
        - lambda: id(adc_in_v).publish_state(x/257.2580645161);

###

  - platform: template
    name: "${dev} ESP Free Heap"
    lambda: |-
      // arduino
      float heap = ESP.getFreeHeap();
      // idf
      //float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    name: "${dev} ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "${dev} ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""
    entity_category: diagnostic

### ### ###


### ### ###

text_sensor:

  - platform: version
    name: "${dev} ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic


