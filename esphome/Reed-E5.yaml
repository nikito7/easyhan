# Based in EB1
# ESP8266
# Easy HAN E5

substitutions:
  dev: Reed1
  name: reed1


esphome:
  name: ${name}
  on_boot:
    priority: -500
    then:
      - delay: 7s
      - switch.turn_on: led_pin
  project:
    name: easyhan.e5-reed
    version: "1.03"

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/Reed-E5.yaml@dev
  import_full_config: true

esp8266:
  board: esp07s # ESP8266 4M

#esp32:
#  board: adafruit_feather_esp32s3 # N4 R2
#  #board: esp32-s3-devkitc-1 # N8
#  #board: esp32-c6-devkitc-1
#  framework:
#    type: arduino
#  #flash_size: 8MB
#  variant: esp32s3


wifi:
  output_power: 17db
  #use_address: 10.1.0.44

  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #password: edpbox123

  ap:
    ssid: "Easy-HAN-${dev}"
    password: edpbox123
    ap_timeout: 15s # change me

captive_portal:

###

#esp32_ble_tracker:
#bluetooth_proxy:

###

web_server:
  local: true
  
# não usar com web_server
#logger:
#  level: debug
#  baud_rate: 0

api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

button:
  - platform: restart
    name: "${dev} ESP Restart"

switch:

  - platform: gpio
    id: led_pin
    pin:
      number: 2
      inverted: yes

### ### ###

binary_sensor:

  - platform: gpio
    pin:
      number: 5
      mode:
        input: true
        pullup: true
    name: "${dev} Reed 1"

