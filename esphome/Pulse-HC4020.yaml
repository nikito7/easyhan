# Pulse Counter
# Binary Counter

substitutions:
  dev: Pulse
  name: pulse

esphome:
  name: ${name}
  project:
    name: easyhan.pulse
    version: "1.02"
  on_boot:
    priority: 1000
    then:
      - lambda: |-
          pinMode(5, INPUT_PULLDOWN);
          pinMode(6, INPUT_PULLDOWN);
          pinMode(7, INPUT_PULLDOWN);
          pinMode(8, INPUT_PULLDOWN);
          pinMode(9, INPUT_PULLDOWN);
          pinMode(10, INPUT_PULLDOWN);
          pinMode(11, INPUT_PULLDOWN);
          pinMode(12, INPUT_PULLDOWN);
          pinMode(13, INPUT_PULLDOWN);
          pinMode(14, INPUT_PULLDOWN);
          pinMode(15, INPUT_PULLDOWN);
          pinMode(16, INPUT_PULLDOWN);
          delay(100);
          pinMode(17, OUTPUT);
          digitalWrite(17, LOW);
          delay(100);

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/Pulse.yaml@dev
  import_full_config: true

esp32:
  board: esp32-s3-devkitc-1 # N8
  framework:
    type: arduino
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  #use_address: 10.1.0.39

  ssid: !secret wifi_ssid
  #password: !secret wifi_password
  password: edpbox123

  ap:
    ssid: "Easy-HAN-${dev}"
    password: edpbox123
    ap_timeout: 20s # change me

captive_portal:

