sensor:

  - platform: template
    name: "${dev} Counter Debug"
    lambda: |-
        // n to a order
        uint16_t hc_pulse = (
          (digitalRead(9) << 13)
        | (digitalRead(10) << 12)
        | (digitalRead(11) << 11)
        | (digitalRead(16) << 10)
        | (digitalRead(15) << 9)
        | (digitalRead(13) << 8)
        | (digitalRead(14) << 7)
        | (digitalRead(6) << 6)
        | (digitalRead(8) << 5)
        | (digitalRead(7) << 4)
        | (digitalRead(5) << 3)
        |  digitalRead(12)
        );
        return hc_pulse;

###

  - platform: template
    name: "${dev} Adc In"
    id: adc_in_v
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement

  - platform: adc
    name: "${dev} Adc In raw" # ESP32-S3 PCB
    raw: true
    pin: 1
    attenuation: 0dB
    samples: 8
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    icon: mdi:information
    state_class: measurement
    on_value:
      then:
        - lambda: id(adc_in_v).publish_state(x/257.2580645161);

###

  - platform: template
    name: "${dev} ESP Free Heap"
    lambda: |-
      // arduino
      float heap = ESP.getFreeHeap();
      // idf
      //float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    name: "${dev} ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "${dev} ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""
    entity_category: diagnostic

