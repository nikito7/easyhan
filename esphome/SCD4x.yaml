# CO2 SCD4x

substitutions:
  dev: T45
  name: scd4x

esphome:
  name: ${name}
  project:
    name: easyhan.scd4x
    version: "1.03"

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/SCD4x.yaml@dev
  import_full_config: true

esp32:
  board: esp32-s3-devkitc-1 # N8
  framework:
    type: arduino
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  #use_address: 10.1.0.39

  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #password: edpbox123

  ap:
    ssid: "Easy-HAN-${dev}"
    password: edpbox123
    ap_timeout: 20s # change me

captive_portal:

###

#esp32_ble_tracker:
#bluetooth_proxy:

###

web_server:
  local: true
  version: 3
  
logger:
  #level: debug
  level: verbose

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

###

api:
  reboot_timeout: 30min

button:
  - platform: restart
    name: "${dev} ESP Restart"
    entity_category: diagnostic

  - platform: template
    name: "${dev} SCD41 Factory Reset"
    on_press:
      then:
        - scd4x.factory_reset: my_scd41
    entity_category: diagnostic

###

i2c:
  sda: 33
  scl: 34
  scan: true

###

sensor:

## ## ##

  - platform: homeassistant
    id: bme_ha
    entity_id: sensor.bme280_pressure
    internal: true

  - platform: scd4x
    id: my_scd41
    ambient_pressure_compensation_source: bme_ha
    co2:
      name: "${dev} SCD41 CO2"
    temperature:
      name: "${dev} SCD41 Temperature"
      accuracy_decimals: 1
    humidity:
      name: "${dev} SCD41 Humidity"
      accuracy_decimals: 1

## ## ##

  - platform: template
    name: "${dev} Adc In"
    id: adc_in_v
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement

  - platform: adc
    name: "${dev} Adc In raw" # ESP32-S3 PCB
    raw: true
    pin: 1
    attenuation: 0dB
    samples: 8
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    icon: mdi:information
    state_class: measurement
    on_value:
      then:
        - lambda: id(adc_in_v).publish_state(x/257.2580645161);

###

  - platform: template
    name: "${dev} ESP Free Heap"
    lambda: |-
      // arduino
      float heap = ESP.getFreeHeap();
      // idf
      //float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    name: "${dev} ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "${dev} ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""
    entity_category: diagnostic

### ### ###


### ### ###

text_sensor:

  - platform: version
    name: "${dev} ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic


