# X04v1.3
# ESP32-S3 N8

esphome:
  name: "t46-x04-adc"
  friendly_name: "T46 X04 ADC"

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: "ssn-7"
    password: !secret wifi_password

###

esp32_ble:
  max_connections: 5

esp32_ble_tracker:

bluetooth_proxy:
  #connection_slots: 1

###

web_server:
  local: true
  
logger:
  level: debug

api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

button:
  - platform: restart
    name: "ESP Restart"

interval:
  - interval: 5s
    then:
      - switch.turn_on: led_pin
      - delay: 30ms
      - switch.turn_off: led_pin

switch:
  - platform: gpio
    id: led_pin
    pin:
      number: 39
      inverted: yes

one_wire:
  - platform: gpio
    pin: 38

sensor:

####

  - platform: dallas_temp
    name: "DS18B20 Temperature"

####

  - platform: adc
    name: "A1 In raw"
    id: adc_in
    raw: true
    pin: 1
    attenuation: 0dB
    samples: 20
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    state_class: measurement
    update_interval: 5s

  - platform: template
    name: "A1 In"
    lambda: |-
      return  id(adc_in).state / 257.2580645161;
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement

###

  - platform: adc
    name: "A2 raw"
    id: adc_a2
    raw: true
    pin: 2
    attenuation: 0dB
    samples: 20
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    state_class: measurement
    update_interval: 5s


# 4-20ma Water Level // Resistor 47 Ohm = <1V
# Tasmota: ESP8266 raw: 323
# ESPHome S3       raw: 1265 

  - platform: template
    name: "A2 tpl"
    lambda: |-
      return  id(adc_a2).state * 3.9; // to fix
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement

###

  - platform: template
    name: "ESP Free Heap"
    lambda: |-
      float heap = ESP.getFreeHeap();
      // float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement

  - platform: wifi_signal
    name: "ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement

  - platform: uptime
    name: "ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""

### ### ###

### ### ###

text_sensor:

  - platform: template
    name: "ESP Clock"
    icon: mdi:clock
    lambda: |-
      char str[25];
      time_t currTime = id(esptime).now().timestamp;
      strftime(str, sizeof(str), "%H:%M:%S", localtime(&currTime));
      return {str};
    update_interval: 5s
    id: esp_clock

