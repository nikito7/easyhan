# X04v1.3
# ESP32-S3 N8

esphome:
  name: "t46-x04-adc"
  friendly_name: "T46 X04 ADC"

esp32:
  board: esp32-s3-devkitm-1
  framework:
    type: esp-idf
  flash_size: 8MB
  variant: esp32s3

wifi:
  output_power: 15db
  
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  - ssid: "ssn-7"
    password: !secret wifi_password

###

esp32_ble:
  max_connections: 5

esp32_ble_tracker:

bluetooth_proxy:
  #connection_slots: 1

###

web_server:
  local: true
  
logger:
  level: debug

api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

button:
  - platform: restart
    name: "ESP Restart"

interval:
  - interval: 1s
    then:
      - switch.turn_on: led_pin
      - delay: 30ms
      - switch.turn_off: led_pin

switch:
  - platform: gpio
    id: led_pin
    pin:
      number: 39
      inverted: yes

####

sensor:

####

  - platform: adc
    name: "A1 In raw"
    id: adc_in
    raw: true
    pin: 1
    attenuation: 0dB
    samples: 20
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    state_class: measurement
    update_interval: 10s

  - platform: template
    name: "A1 In"
    lambda: |-
      return  id(adc_in).state / 257.2580645161;
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    update_interval: 10s

###

  - platform: adc
    name: "A2 raw"
    id: adc_a2
    raw: true
    pin: 2
    attenuation: 0dB
    samples: 20
    accuracy_decimals: 0
    device_class: ""
    unit_of_measurement: "raw"
    state_class: measurement
    update_interval: 5s


# 4-20ma Water Level 10m // Resistor 47 Ohm = <1V
# ESPHome S3
# raw: 787	0.18v	0.0002287166	0.0m
# raw: 1551	x	x		2.20m
# raw: 2114	x	x		4.40m  max real.

  - platform: template
    name: "A2 In"
    lambda: |-
      return  id(adc_a2).state * 0.0002287166;
    accuracy_decimals: 2
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    update_interval: 10s

  - platform: template
    name: "A2 Linear"
    lambda: |-
      return  id(adc_a2).state;
    filters:
      - filter_out: nan
      - calibrate_linear:
         method: exact
         datapoints:
          - 787 -> 0.0
          - 1551 -> 2.20
          - 2114 -> 4.40
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
      - sliding_window_moving_average:
          window_size: 5
          send_every: 5
    accuracy_decimals: 2
    device_class: distance
    unit_of_measurement: "m"
    state_class: measurement
    update_interval: 5s

###

  - platform: template
    name: "ESP Free Heap"
    lambda: |-
      // arduino
      //float heap = ESP.getFreeHeap();
      // idf
      float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement

  - platform: wifi_signal
    name: "ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement

  - platform: uptime
    name: "ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""

### ### ###

### ### ###

text_sensor:

  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    hide_timestamp: true
    hide_hash: true

  - platform: template
    name: "ESP Clock"
    icon: mdi:clock
    lambda: |-
      char str[25];
      time_t currTime = id(esptime).now().timestamp;
      strftime(str, sizeof(str), "%H:%M:%S", localtime(&currTime));
      return {str};
    update_interval: 10s
    id: esp_clock

