### Voltage & Current ###

  - platform: modbus_controller
    name: "Voltage L1"
    address: 0x006C
    unit_of_measurement: "V"
    register_type: read
    value_type: U_WORD
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
      - filter_out: nan
    device_class: voltage
    state_class: measurement
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

  - platform: modbus_controller
    name: "Current L1"
    address: 0x006D
