#######

  - platform: template
    name: "EMI Code"
    icon: mdi:chip
    accuracy_decimals: 0
    id: emi_code
    entity_category: diagnostic

  - platform: modbus_controller
    skip_updates: 14            ### ###
    name: "EMI Year"
    custom_command: [0x1, 0x4, 0x0, 0x3, 0x0, 0x4]
    register_count: 1
    response_size: 25
    lambda: |-
      char hFw1[12];
      char hFw2[12];
      char hFw3[12];
      char _emi[24];

      uint32_t hMnfC = (data[0] << 24 | data[1] << 16 | data[2] << 8 | data[3]);
      uint16_t hMnfY = (data[4] << 8 | data[5]);

      sprintf(hFw1, "%c%c%c%c%c",
              data[6],
              data[7],
              data[8],
              data[9],
              data[10]);

      sprintf(hFw2, "%c%c%c%c%c",
              data[11],
              data[12],
              data[13],
              data[14],
              data[15]);

      sprintf(hFw3, "%c%c%c%c%c",
              data[16],
              data[17],
              data[18],
              data[19],
              data[20]);

      id(emi_fw1).publish_state(hFw1);
      id(emi_fw2).publish_state(hFw2);
      id(emi_fw3).publish_state(hFw3);
      id(emi_code).publish_state(hMnfC);

      switch (hMnfC) {
        case 6623491:
          sprintf(_emi, "%s", "T Janz GPRS");
          break;
        case 6750210:
          sprintf(_emi, "%s", "M Landis+Gyr S3");
          break;
        case 6754306:
          sprintf(_emi, "%s", "T Landis+Gyr S3");
          break;
        case 6754307:
          sprintf(_emi, "%s", "T Landis+Gyr S5");
          break;
        case 11010050:
          sprintf(_emi, "%s", "M Sagem CX1000-6");
          break;
        case 11010051:
          sprintf(_emi, "%s", "M Sagem S212");
          break;
        case 11014146:
          sprintf(_emi, "%s", "T Sagem CX2000-9");
          break;
        case 16973825:
          sprintf(_emi, "%s", "? Ziv ???");
          break;
        case 16977920:
          sprintf(_emi, "%s", "T Ziv 5CTD-E2F");
          break;
        case 18481154:
          sprintf(_emi, "%s", "M Kaifa MA109P");
          break;
        case 18481156:
          sprintf(_emi, "%s", "M Kaifa MA109H");
          break;
        default:
          sprintf(_emi, "%s", "? ??? ???");
      }

      id(emi_name).publish_state(_emi);

      return hMnfY;

      // eof
    ## lambda eof
    accuracy_decimals: 0
    icon: mdi:calendar
    entity_category: diagnostic
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

### ### ###

globals:

   - id: idx
     type: int[20]
     restore_value: no 

### ### ###

text_sensor:

### ### ###

#  - platform: openthread_info
#    role:
#      name: "Thread Device Role"

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
    entity_category: diagnostic

  - platform: template
    name: "ESP Clock"
    icon: mdi:clock
    lambda: |-
      char str[36];
      time_t currTime = id(esptime).now().timestamp;
      strftime(str, sizeof(str), "%H:%M:%S", localtime(&currTime));
      return {str};
    update_interval: never
    id: esp_clock

###

  - platform: modbus_controller
    name: "Clock"
    register_type: read
    address: 0x0001
    register_count: 1
    response_size: 12
    icon: mdi:clock
    lambda: |-
        uint8_t hh, mm, ss;
        hh = data[5];
        mm = data[6];
        ss = data[7];
        char ebclk[24];
        sprintf(ebclk,"%02d:%02d:%02d",hh,mm,ss);
        ESP_LOGI("HAN", "Clock %s", ebclk);
        return {ebclk};
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

###

  - platform: modbus_controller
    force_new_range: true        ### ###
    name: "Tariff"
    register_type: read
    address: 0x000B
    register_count: 1
    response_size: 2
    icon: mdi:counter
    lambda: |-
        auto z = "Null";
        if (data[0] == 1) z = "Vazio";
        else if (data[0] == 2) z = "Ponta";
        else if (data[0] == 3) z = "Cheias";
        return {z};
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin
###

  - platform: modbus_controller
    skip_updates: 17            ### ###
    name: "LP IDs"
    custom_command: [0x1, 0x4, 0x0, 0x80, 0x0, 0x1]
    register_count: 1
    response_size: 14
    lambda: |-
      char lpindex[36];
      sprintf(lpindex,"%d,%d,%d,%d,%d,%d,%d,%d",
          data[0],
          data[1],
          data[2],
          data[3],
          data[4],
          data[5],
          data[6],
          data[7]);
      id(idx)[3] = data[2];
      id(idx)[4] = data[3];
      id(idx)[5] = data[4];
      id(idx)[6] = data[5];
      id(idx)[7] = data[6];
      id(idx)[8] = data[7];
      return {lpindex};
      // eof
    icon: mdi:chip
    entity_category: diagnostic
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

###

  - platform: modbus_controller
    name: "LP Date Time"
    custom_command: [0x1, 0x44, 0x0, 0x1]
    register_count: 1
    response_size: 42
    lambda: |-
      ESP_LOGI("HAN", "LP Date Time data[0]: 0x%02X", data[0]);
      uint8_t _emi_err1 = data[0];
      uint16_t lpYY = (data[1] << 8 | data[2]);
      uint8_t lpMT = data[3];
      uint8_t lpDD = data[4];
      uint8_t lpHH = data[6];
      uint8_t lpMM = data[7];
      // ### A
      if (id(idx)[3] == 9) {
      // ### A
      uint32_t lp3g = (data[14] << 24 | data[15] << 16 | data[16] << 8 | data[17]);
      id(lpImport).publish_state(lp3g);
      //
      if (id(idx)[4] == 10) {
      uint32_t lp4g = (data[18] << 24 | data[19] << 16 | data[20] << 8 | data[21]);
      id(lpExport).publish_state(lp4g);
      }
      if (id(idx)[6] == 10) {
      uint32_t lp6g = (data[26] << 24 | data[27] << 16 | data[28] << 8 | data[29]); 
      id(lpExport).publish_state(lp6g);
      }
      // ### A
      }
      // ### A
      //
      //  new LP 2026 16bits id20 id24
      //
      if (id(idx)[3] == 20) {
      uint32_t lp3g = (data[14] << 8 | data[15]);
      uint32_t lp4g = (data[16] << 8 | data[17]);
      uint32_t lp5g = (data[18] << 8 | data[19]);
      id(lpImport).publish_state(lp3g);
      id(lpExport).publish_state(lp4g);
      id(lpVL1).publish_state(lp5g);
      }
      // 
      char _emi_err[12];
      sprintf(_emi_err,"0x%0X",_emi_err1);
      id(emi_errS).publish_state(_emi_err);
      //
      char lpclk[36];
      sprintf(lpclk,"%04d-%02d-%02dT%02d:%02d",lpYY,lpMT,lpDD,lpHH,lpMM);
      return {lpclk};
    icon: mdi:calendar
    on_value:
      - then:
        - switch.turn_on: led_pin
        - delay: 30ms
        - switch.turn_off: led_pin

#######

  - platform: template
    name: "EMI Name"
    icon: mdi:chip
    id: emi_name
    entity_category: diagnostic

