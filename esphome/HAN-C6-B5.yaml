# EB3
# ESP32-C6 / Easy HAN B5
# Tested on: 2026.8.2
# Active development yaml

interval:
  - interval: 12s
    then:
      - lambda: |-
          if (id(edpbox_polling).state) {
              id(esp_clock).update();
              id(edpbox).update();
          }

esphome:
  name: han-b5-eb3
  friendly_name: HAN
  min_version: 2026.8.2
  on_boot:
    priority: -500
    then:
      - switch.turn_on: led_pin
      - delay: 7s
      - switch.turn_on: edpbox_polling
  project:
    name: easyhan.edpbox3-c6-b5
    version: "2.15"

dashboard_import:
  package_import_url: github://nikito7/easyhan/esphome/HAN-C6-B5.yaml@dev
  import_full_config: true

#esp8266:
#  board: esp07s

esp32:
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 32768 # esp32

wifi:
  output_power: 15db
  #use_address: 10.1.0.46
  #use_address: "fd6a:7ff7:c70:1:70fc:f12c:7c8d:6f80"

  #ssid: ssn-7
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  #password: edpbox123

  ap:
    ssid: "Easy-HAN-EB99"
    password: edpbox123

captive_portal:

### ### ###

#network:
#  enable_ipv6: true

#openthread:
#  tlv: !secret thread_tlv
#  use_address: "fd6a:7ff7:c70:1:70fc:f12c:7c8d:6f80"

### ### ###

web_server:
  local: true
  version: 3
  
logger:
  #level: verbose
  #level: debug
  #baud_rate: 0 # esp8266

api:
  reboot_timeout: 30min

ota:
  - platform: esphome

time:
  - platform: homeassistant
    id: esptime

button:
  - platform: restart
    name: "ESP Restart"

###

switch:

  - platform: gpio
    id: led_pin
    pin:
      number: 2
      inverted: no # C6 no
                   # esp07s yes

  - platform: template
    name: "ESP Polling"
    id: "edpbox_polling"
    optimistic: yes

###

uart:

#ifdef ESP32S3
#define HAN_DIR 16
#define HAN_TX 15
#define HAN_RX 17

#elif ESP32C6
#define HAN_DIR 3
#define HAN_TX 5
#define HAN_RX 4

  id: modbus_serial
  rx_pin: 4
  #  number: 4
  #  mode:
  #    input: true
  #    pullup: true
  tx_pin: 5
  baud_rate: 9600
  stop_bits: 1
  #stop_bits: 2 # ziv

modbus:
  flow_control_pin: 3
  id: modbus1
  uart_id: modbus_serial
  turnaround_time: 1000ms
  send_wait_time: 1800ms

modbus_controller:
  - id: edpbox
    update_interval: never
    address: 0x1
    setup_priority: -10
    offline_skip_updates: 5
    max_cmd_retries: 0

###

sensor:

###

  - platform: template
    name: "ESP Free Heap"
    lambda: |-
      // arduino
      //float heap = ESP.getFreeHeap();
      // idf
      float heap = esp_get_free_heap_size();
      return heap / 1024.0;
    unit_of_measurement: "kB"
    icon: mdi:chip
    state_class: measurement
    entity_category: diagnostic

  - platform: wifi_signal
    name: "ESP Signal"
    unit_of_measurement: "dB"
    state_class: measurement
    entity_category: diagnostic

  - platform: uptime
    name: "ESP Uptime"
    filters:
      - lambda: return x/3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1
    device_class: ""
    entity_category: diagnostic

